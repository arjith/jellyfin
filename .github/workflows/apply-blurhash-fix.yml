name: Apply blurhash retry fix

on:
  push:
    branches:
      - agent/avoid-retrying-unavailable-blurhash

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply focused source change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Emby.Server.Implementations/Library/LibraryManager.cs')
          source = path.read_text()
          old = 'if (image.Width == 0 || image.Height == 0 || string.IsNullOrEmpty(image.BlurHash))'
          new = 'if (image.Width == 0 || image.Height == 0 || image.BlurHash is null)'
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one match, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY

          rm .github/workflows/apply-blurhash-fix.yml

      - name: Commit focused change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Emby.Server.Implementations/Library/LibraryManager.cs .github/workflows/apply-blurhash-fix.yml
          git commit -m 'Avoid retrying unavailable blurhashes on every scan'
          git push
